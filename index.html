<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>doblexo – Opening &amp; Closing Tasks</title>
<style>
  :root {
    --blue: #0118bd;
    --blue-dark: #000e7a;
    --pink: #fa7de1;
    --pink-soft: #fde6f8;
    --ink: #0a0f2e;
    --white: #ffffff;
    --line: #c9cdea;
  }
  * { box-sizing: border-box; }
  html { font-size: 20px; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    color: var(--ink);
    background: var(--white);
    line-height: 1.4;
  }
  .skip {
    position: absolute; left: -9999px; top: 0;
    background: var(--blue); color: var(--white); padding: 0.6rem 1rem; z-index: 10;
  }
  .skip:focus { left: 0.5rem; top: 0.5rem; }

  header {
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 1.2rem;
    padding: 1rem 1.5rem;
    border-bottom: 6px solid var(--pink);
  }
  .home {
    justify-self: start; display: block; border-radius: 14px; padding: 4px;
  }
  .home img { height: 92px; width: auto; display: block; }
  .title { text-align: center; }
  header h1 {
    margin: 0; font-size: 1.9rem; line-height: 1.15; color: var(--blue);
  }
  header p { margin: 0.2rem 0 0; font-size: 1.05rem; font-weight: 600; }

  /* Tabs */
  .tabs {
    display: flex; gap: 0.6rem;
    padding: 1rem 1.5rem 0;
    position: sticky; top: 0; background: var(--white); z-index: 5;
    border-bottom: 3px solid var(--blue);
  }
  .tab {
    flex: 1;
    min-height: 72px;
    font: inherit; font-size: 1.5rem; font-weight: 800;
    border: 3px solid var(--blue); border-bottom: none;
    border-radius: 16px 16px 0 0;
    background: var(--white); color: var(--blue);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 0.6rem;
  }
  .tab[aria-selected="true"] { background: var(--blue); color: var(--white); }
  .tab .count {
    font-size: 1rem; font-weight: 700;
    padding: 0.15rem 0.6rem; border-radius: 999px;
    border: 2px solid currentColor;
  }

  :focus-visible {
    outline: 4px solid var(--pink);
    outline-offset: 3px;
    box-shadow: 0 0 0 7px var(--blue);
  }

  main { padding: 1.2rem 1.5rem 3rem; max-width: 1100px; margin: 0 auto; }

  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem;
  }
  .panel-head h2 { margin: 0; font-size: 1.6rem; color: var(--blue); }

  .progress-wrap { flex: 1 1 320px; }
  .progress-text { font-size: 1.15rem; font-weight: 700; margin: 0 0 0.4rem; }
  .bar {
    height: 22px; border: 3px solid var(--blue); border-radius: 999px;
    overflow: hidden; background: var(--white);
  }
  .bar span { display: block; height: 100%; width: 0; background: var(--pink); transition: width .25s; }

  .status {
    justify-self: end;
    font-size: 1rem; font-weight: 800;
    padding: 0.5rem 1rem; border-radius: 999px;
    border: 3px solid var(--blue); color: var(--blue); background: var(--white);
    white-space: nowrap;
  }
  .status.warn { background: var(--ink); color: var(--white); border-color: var(--ink); }

  .pin-screen {
    position: fixed; inset: 0; z-index: 50;
    background: rgba(10, 15, 46, 0.85);
    display: grid; place-items: center; padding: 1rem;
  }
  .pin-screen[hidden] { display: none; }
  .pin-box {
    background: var(--white); border-radius: 22px; padding: 2rem;
    width: min(520px, 100%); border-top: 10px solid var(--pink);
  }
  .pin-box h2 { margin: 0 0 0.5rem; color: var(--blue); font-size: 1.7rem; }
  .pin-box p { margin: 0 0 1.2rem; font-size: 1.15rem; }
  .pin-box label { display: block; font-weight: 800; font-size: 1.15rem; margin-bottom: 0.4rem; }
  .pin-box input {
    width: 100%; height: 72px; font: inherit; font-size: 2rem; font-weight: 800;
    text-align: center; letter-spacing: .3em;
    border: 4px solid var(--blue); border-radius: 14px; color: var(--ink);
  }
  .pin-box button {
    width: 100%; margin-top: 1rem; min-height: 72px;
    font: inherit; font-size: 1.4rem; font-weight: 800;
    background: var(--blue); color: var(--white); border: 0; border-radius: 14px; cursor: pointer;
  }
  .pin-error { color: #b00020; font-weight: 800; min-height: 1.4em; margin: 0.8rem 0 0 !important; }

  fieldset { border: 0; margin: 0; padding: 0; }
  legend { position: absolute; left: -9999px; }

  ol.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 0.7rem; }

  .item .row {
    display: flex; align-items: center; gap: 1.1rem;
    min-height: 92px;
    padding: 0.9rem 1.2rem;
    border: 3px solid var(--line); border-radius: 18px;
    background: var(--white);
    font-size: 1.4rem; font-weight: 600;
  }
  .item .row.is-done { background: var(--pink-soft); border-color: var(--pink); }
  .item .row:focus-within { border-color: var(--blue); }
  .item .num {
    flex: none; width: 2.2rem; text-align: right;
    font-size: 1.1rem; font-weight: 800; color: var(--blue);
  }
  .item .text { flex: 1; }
  .item .sign { flex: none; min-width: 7rem; display: flex; flex-direction: column; align-items: center; gap: 0.2rem; }
  .item .sign label { font-size: 0.85rem; font-weight: 800; color: var(--blue); text-transform: uppercase; letter-spacing: .04em; }
  .item .sign input {
    width: 7rem; height: 60px;
    font: inherit; font-size: 1.5rem; font-weight: 800; text-align: center;
    text-transform: uppercase; letter-spacing: .08em;
    color: var(--blue); background: var(--white);
    border: 4px solid var(--blue); border-radius: 12px;
  }
  .item .sign input::placeholder { color: #5a5f86; font-weight: 600; font-size: 1.1rem; letter-spacing: 0; text-transform: none; }
  .item .row.is-done .sign input { background: var(--blue); color: var(--white); }
  .item label.row { cursor: pointer; }
  .item .sign .check {
    appearance: none; -webkit-appearance: none; margin: 0;
    width: 60px; height: 60px;
    border: 4px solid var(--blue); border-radius: 12px;
    background: var(--white); cursor: pointer;
    display: grid; place-content: center;
  }
  .item .check::after {
    content: ""; width: 28px; height: 15px;
    border-left: 6px solid var(--white); border-bottom: 6px solid var(--white);
    transform: rotate(-45deg) translate(2px, -3px); opacity: 0;
  }
  .item .check:checked { background: var(--blue); }
  .item .check:checked::after { opacity: 1; }
  .item .sign .tag { font-size: 0.85rem; font-weight: 800; color: var(--blue); text-transform: uppercase; letter-spacing: .04em; }
  .item .time { font-size: 0.9rem; font-weight: 700; min-height: 1.2em; color: var(--ink); }

  .all-done {
    margin-top: 1.2rem; padding: 1.2rem; border-radius: 18px;
    background: var(--blue); color: var(--white);
    font-size: 1.4rem; font-weight: 800; text-align: center;
  }
  .empty {
    padding: 2rem; border: 3px dashed var(--blue); border-radius: 18px;
    font-size: 1.3rem; text-align: center;
  }
  .sr-only {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  @media (max-width: 640px) {
    html { font-size: 17px; }
    .home img { height: 64px; }
    .tab { font-size: 1.25rem; }
  }
  @media (prefers-reduced-motion: reduce) { .bar span { transition: none; } }
</style>
</head>

    <h1>Opening &amp; Closing Tasks</h1>
    <p id="today"></p>
  </div>
  <p class="status" id="status" role="status">Loading…</p>
</header>

<div class="tabs" role="tablist" aria-label="Checklists">
  <button class="tab" role="tab" id="tab-opening" aria-controls="panel-opening" aria-selected="true">
    Opening <span class="count" id="count-opening" aria-hidden="true"></span>
  </button>
  <button class="tab" role="tab" id="tab-closing" aria-controls="panel-closing" aria-selected="false" tabindex="-1">
    Closing <span class="count" id="count-closing" aria-hidden="true"></span>
  </button>
</div>

<main id="main">
  <section id="panel-opening" role="tabpanel" aria-labelledby="tab-opening" tabindex="0"></section>
  <section id="panel-closing" role="tabpanel" aria-labelledby="tab-closing" tabindex="0" hidden></section>
  <p class="sr-only" id="announce" aria-live="polite"></p>
</main>

<div class="pin-screen" id="pin-screen" role="dialog" aria-modal="true" aria-labelledby="pin-title" hidden>
  <form class="pin-box" id="pin-form" novalidate>
    <h2 id="pin-title">Enter shop PIN</h2>
    <p>This is needed once on each tablet so checklist entries save to the log.</p>
    <label for="pin-input">Shop PIN</label>
    <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" aria-describedby="pin-error">
    <p class="pin-error" id="pin-error" aria-live="assertive"></p>
    <button type="submit">Save PIN</button>
  </form>
</div>

<script>
  // ===== Google Sheet connection =====
  const API_URL = "https://script.google.com/macros/s/AKfycbxAMJAwQIb41fE6xOXb2xH8aMKwIlE9ak2fxUk_dkAkH-GemL1r9gPkdygVpbcyVxivwg/exec";

  // ===== Edit tasks here =====
  const LISTS = {
    opening: {
      title: "Opening Checklist",
      checkOnly: "all",                 // every opening task is a checkbox
      tasks: [
        "Unlock door, turn on lights, and flip open sign",
        "Clock in",
        "Walk through to make sure there are no crickets or bugs",
        "Make sure lounge area is tidy",
        "Organize merch rack",
        "Restock cups",
        "Put down chairs",
        "Check restroom is clean and stocked (toilet paper, soap, paper towels)",
        "Take out syrups from fridge",
        "Plug in and fill kettle for matcha",
        "Sift matcha for that day only",
        "Fluff ice",
        "Make any cold foams if needed",
        "Dial in beans"
      ]
    },
    closing: {
      title: "Closing Checklist",
      checkOnly: [11, 12, 13],      // these task numbers are checkboxes; the rest need initials
      tasks: [
        "Update the syrup prep app",
        "Wash dishes",
        "Clean espresso machine",
        "Sweep",
        "Mop if needed",
        "Make sure fridges are closed",
        "Restock front of house milks",
        "Turn off and charge scales",
        "Check restroom, clean and restock",
        "Vacuum rug",
        "Put tip jar under counter",
        "Turn off all lights",
        "Clock out"
      ]
    }
  };
  // ===========================

  const NAMES = ["opening", "closing"];
  const CHECK = "✓";
  function isCheck(name, i) {
    const c = LISTS[name].checkOnly;
    return c === "all" || (Array.isArray(c) && c.indexOf(i + 1) !== -1);
  }
  const SHEET_NAME = { opening: "Opening", closing: "Closing" };
  const PIN_KEY = "doblexo-shop-pin";
  const QUEUE_KEY = "doblexo-checklist-queue";
  const COMMIT_DELAY = 1500;   // ms after typing stops before saving
  const REFRESH_EVERY = 30000; // ms between pulls from the sheet

  const now = new Date();
  const dayKey = now.getFullYear() + "-" + (now.getMonth() + 1) + "-" + now.getDate();
  document.getElementById("today").textContent =
    now.toLocaleDateString(undefined, { weekday: "long", month: "long", day: "numeric" });

  // ---------- small storage helpers (never throw) ----------
  function getLS(k, fallback) {
    try { const v = localStorage.getItem(k); return v === null ? fallback : JSON.parse(v); } catch (e) { return fallback; }
  }
  function setLS(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
  function delLS(k) { try { localStorage.removeItem(k); } catch (e) {} }

  // ---------- state ----------
  // signed[name][index] = { ini, time }
  const signed = {};
  NAMES.forEach(n => {
    const saved = getLS("doblexo-initials-" + n, null);
    signed[n] = saved && saved.day === dayKey && saved.signed ? saved.signed : {};
  });
  const committed = { opening: {}, closing: {} };   // last value sent per task
  NAMES.forEach(n => Object.keys(signed[n]).forEach(i => committed[n][i] = signed[n][i].ini));
  let queue = getLS(QUEUE_KEY, []);
  let pin = getLS(PIN_KEY, "");
  const timers = {};
  const els = { opening: [], closing: [] };          // per task: {row, box, time}

  function saveLocal(name) { setLS("doblexo-initials-" + name, { day: dayKey, signed: signed[name] }); }
  function timeNow() { return new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }); }

  // ---------- status pill ----------
  const statusEl = document.getElementById("status");
  function setStatus(text, warn) {
    if (statusEl.textContent !== text) statusEl.textContent = text;
    statusEl.classList.toggle("warn", !!warn);
  }

  // ---------- building the lists ----------
  function build(name) {
    const list = LISTS[name];
    const panel = document.getElementById("panel-" + name);
    panel.innerHTML =
      '<div class="panel-head"><h2>' + list.title + '</h2>' +
      '<div class="progress-wrap">' +
        '<p class="progress-text" id="prog-text-' + name + '"></p>' +
        '<div class="bar" role="progressbar" id="bar-' + name + '" aria-label="' + list.title + ' progress" aria-valuemin="0"><span></span></div>' +
      '</div></div>';

    const fs = document.createElement("fieldset");
    fs.innerHTML = '<legend>' + list.title + '</legend>';
    const ol = document.createElement("ol");
    ol.className = "list";

    list.tasks.forEach((task, i) => {
      const id = name + "-" + i;
      const li = document.createElement("li");
      li.className = "item";
      if (isCheck(name, i)) {
        li.innerHTML =
          '<label class="row" for="' + id + '">' +
            '<span class="num" aria-hidden="true">' + (i + 1) + '.</span>' +
            '<span class="text" id="' + id + '-text"></span>' +
            '<span class="sign">' +
              '<span class="tag" aria-hidden="true">Done</span>' +
              '<input class="check" id="' + id + '" type="checkbox" aria-describedby="' + id + '-time">' +
              '<span class="time" id="' + id + '-time"></span>' +
            '</span>' +
          '</label>';
      } else {
        li.innerHTML =
          '<div class="row">' +
            '<span class="num" aria-hidden="true">' + (i + 1) + '.</span>' +
            '<span class="text" id="' + id + '-text"></span>' +
            '<span class="sign">' +
              '<label for="' + id + '">Initials</label>' +
              '<input id="' + id + '" type="text" maxlength="4" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Tap" aria-describedby="' + id + '-text ' + id + '-time">' +
              '<span class="time" id="' + id + '-time"></span>' +
            '</span>' +
          '</div>';
      }
      li.querySelector(".text").textContent = task;
      const row = li.querySelector(".row");
      const box = li.querySelector("input");
      const time = li.querySelector(".time");
      els[name][i] = { row, box, time };

      if (isCheck(name, i)) {
        box.addEventListener("change", () => {
          if (box.checked) signed[name][i] = { ini: CHECK, time: timeNow() };
          else delete signed[name][i];
          saveLocal(name);
          paintTask(name, i);
          update(name, true);
          commit(name, i);
        });
        ol.appendChild(li);
        return;
      }

      box.addEventListener("input", () => {
        const ini = box.value.replace(/[^a-z]/gi, "").toUpperCase();
        if (box.value !== ini) box.value = ini;
        const was = !!signed[name][i];
        if (ini) signed[name][i] = { ini, time: (signed[name][i] && signed[name][i].time) || timeNow() };
        else delete signed[name][i];
        saveLocal(name);
        paintTask(name, i);
        update(name, was !== !!signed[name][i]);
        clearTimeout(timers[id]);
        timers[id] = setTimeout(() => commit(name, i), COMMIT_DELAY);
      });
      box.addEventListener("blur", () => commit(name, i));
      box.addEventListener("keydown", e => {
        if (e.key === "Enter") {
          e.preventDefault();
          commit(name, i);
          const next = els[name][i + 1];
          if (next && next.box.type === "text") next.box.focus(); else box.blur();
        }
      });
      row.addEventListener("click", e => { if (e.target !== box) box.focus(); });
      ol.appendChild(li);
    });
    fs.appendChild(ol);
    panel.appendChild(fs);

    const allDone = document.createElement("p");
    allDone.className = "all-done";
    allDone.id = "alldone-" + name;
    allDone.hidden = true;
    allDone.textContent = "All " + name + " tasks complete. Nice work!";
    panel.appendChild(allDone);
  }

  function paintTask(name, i) {
    const s = signed[name][i], el = els[name][i];
    el.row.classList.toggle("is-done", !!s);
    el.time.textContent = s ? s.time : "";
    if (el.box.type === "checkbox") el.box.checked = !!s;
    else if (document.activeElement !== el.box) el.box.value = s ? s.ini : "";
  }
  function paintAll() {
    NAMES.forEach(n => { LISTS[n].tasks.forEach((_, i) => paintTask(n, i)); update(n, false); });
  }

  function update(name, speak) {
    const total = LISTS[name].tasks.length;
    const n = Object.keys(signed[name]).length;
    document.getElementById("prog-text-" + name).textContent = n + " of " + total + " done";
    const bar = document.getElementById("bar-" + name);
    bar.setAttribute("aria-valuemax", total);
    bar.setAttribute("aria-valuenow", n);
    bar.setAttribute("aria-valuetext", n + " of " + total + " done");
    bar.firstChild.style.width = (total ? (n / total) * 100 : 0) + "%";
    document.getElementById("alldone-" + name).hidden = n !== total;
    document.getElementById("count-" + name).textContent = n + "/" + total;
    if (speak) announce(n === total ? "All " + name + " tasks complete." : n + " of " + total + " done.");
  }

  function announce(msg) {
    const el = document.getElementById("announce");
    el.textContent = "";
    setTimeout(() => { el.textContent = msg; }, 50);
  }

  // ---------- saving to the sheet ----------
  function commit(name, i) {
    clearTimeout(timers[name + "-" + i]);
    const ini = signed[name][i] ? signed[name][i].ini : "";
    if ((committed[name][i] || "") === ini) return;
    committed[name][i] = ini;
    const item = { checklist: SHEET_NAME[name], taskNum: i + 1, task: LISTS[name].tasks[i] };
    if (isCheck(name, i)) item.checked = !!ini; else item.initials = ini;
    queue.push(item);
    setLS(QUEUE_KEY, queue);
    flush();
  }

  let flushing = false, retryTimer = null;
  async function flush() {
    if (flushing) return;
    if (!pin) { showPin(); return; }
    flushing = true;
    clearTimeout(retryTimer);
    try {
      while (queue.length) {
        setStatus("Saving…");
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify(Object.assign({ pin }, queue[0]))
        });
        const data = await res.json();
        if (!data.ok) {
          if (data.error === "bad_pin") { badPin(); return; }
          queue.shift();           // bad request: drop it so it can't block the rest
        } else {
          queue.shift();
          if (!queue.length) applyServer(data.today);
        }
        setLS(QUEUE_KEY, queue);
      }
      setStatus("All saved ✓");
    } catch (err) {
      setStatus("Offline – will retry", true);
      retryTimer = setTimeout(flush, 15000);
    } finally {
      flushing = false;
    }
  }

  // ---------- loading from the sheet ----------
  function applyServer(today) {
    if (!today) return;
    NAMES.forEach(n => {
      const fresh = {};
      const srv = today[SHEET_NAME[n]] || {};
      Object.keys(srv).forEach(num => {
        const i = Number(num) - 1;
        if (i >= 0 && i < LISTS[n].tasks.length) fresh[i] = { ini: srv[num].initials, time: srv[num].time };
      });
      // keep anything still waiting to be sent, and whatever is being typed right now
      queue.filter(q => q.checklist === SHEET_NAME[n]).forEach(q => {
        const i = q.taskNum - 1;
        const val = "checked" in q ? (q.checked ? CHECK : "") : q.initials;
        if (val) fresh[i] = { ini: val, time: (fresh[i] && fresh[i].time) || (signed[n][i] && signed[n][i].time) || timeNow() };
        else delete fresh[i];
      });
      els[n].forEach((el, i) => {
        if (el.box === document.activeElement && el.box.type === "text") {
          if (signed[n][i]) fresh[i] = signed[n][i]; else delete fresh[i];
        }
      });
      signed[n] = fresh;
      const keep = {};
      els[n].forEach((el, i) => { if (el.box === document.activeElement && el.box.type === "text") keep[i] = committed[n][i]; });
      committed[n] = {};
      Object.keys(fresh).forEach(i => committed[n][i] = fresh[i].ini);
      Object.keys(keep).forEach(i => committed[n][i] = keep[i]);
      saveLocal(n);
    });
    paintAll();
  }

  async function pull() {
    if (!pin) { showPin(); return; }
    if (queue.length) { flush(); return; }
    try {
      const res = await fetch(API_URL + "?pin=" + encodeURIComponent(pin));
      const data = await res.json();
      if (!data.ok) { if (data.error === "bad_pin") badPin(); return; }
      applyServer(data.today);
      setStatus("All saved ✓");
    } catch (err) {
      setStatus("Offline – will retry", true);
    }
  }

  // ---------- PIN screen ----------
  const pinScreen = document.getElementById("pin-screen");
  const pinInput = document.getElementById("pin-input");
  const pinError = document.getElementById("pin-error");
  function showPin(msg) {
    pinError.textContent = msg || "";
    pinScreen.hidden = false;
    pinInput.value = "";
    pinInput.focus();
    setStatus("PIN needed", true);
  }
  function badPin() {
    pin = ""; delLS(PIN_KEY);
    showPin("That PIN didn't work. Try again.");
  }
  document.getElementById("pin-form").addEventListener("submit", async e => {
    e.preventDefault();
    const tryPin = pinInput.value.trim();
    if (!tryPin) { pinError.textContent = "Enter the shop PIN."; return; }
    pinError.textContent = "Checking…";
    try {
      const res = await fetch(API_URL + "?pin=" + encodeURIComponent(tryPin));
      const data = await res.json();
      if (!data.ok) { pinError.textContent = "That PIN didn't work. Try again."; pinInput.select(); return; }
      pin = tryPin; setLS(PIN_KEY, pin);
      pinScreen.hidden = true;
      applyServer(data.today);
      setStatus("All saved ✓");
      if (queue.length) flush();
    } catch (err) {
      pinError.textContent = "Couldn't reach the log. Check the Wi-Fi and try again.";
    }
  });

  // ---------- tabs ----------
  const tabs = [...document.querySelectorAll('[role="tab"]')];
  function select(tab, focus) {
    tabs.forEach(t => {
      const on = t === tab;
      t.setAttribute("aria-selected", on);
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
    });
    if (focus) tab.focus();
    setLS("doblexo-checklist-tab", tab.id);
  }
  tabs.forEach((tab, i) => {
    tab.addEventListener("click", () => select(tab, false));
    tab.addEventListener("keydown", e => {
      let j = null;
      if (e.key === "ArrowRight") j = (i + 1) % tabs.length;
      if (e.key === "ArrowLeft") j = (i - 1 + tabs.length) % tabs.length;
      if (e.key === "Home") j = 0;
      if (e.key === "End") j = tabs.length - 1;
      if (j !== null) { e.preventDefault(); select(tabs[j], true); }
    });
  });

  // ---------- start ----------
  NAMES.forEach(build);
  paintAll();
  const lastTab = document.getElementById(getLS("doblexo-checklist-tab", ""));
  if (lastTab) select(lastTab, false);

  if (pin) pull(); else showPin();
  setInterval(() => {
    const busy = NAMES.some(n => els[n].some(el => el.box === document.activeElement && el.box.type === "text"));
    if (!busy && pinScreen.hidden) pull();
  }, REFRESH_EVERY);
  window.addEventListener("online", flush);
  // a tablet left on overnight starts the new day fresh
  setInterval(() => {
    const d = new Date();
    if (d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate() !== dayKey && !queue.length) location.reload();
  }, 60000);
</script>
</body>
</html>
